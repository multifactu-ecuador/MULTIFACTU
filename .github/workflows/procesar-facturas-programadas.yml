name: Procesar facturas programadas (diario 02:00 UTC-5)

on:
  schedule:
    # 02:00 hora Ecuador (UTC-5) = 07:00 UTC
    - cron: "0 7 * * *"
  workflow_dispatch: {}   # permite ejecutar manualmente desde Actions

permissions:
  contents: read

jobs:
  procesar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Llamar a procesar-programadas
        run: |
          curl -X POST "https://pieabvfgokuomzkfotkz.supabase.co/functions/v1/procesar-programadas" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --fail --silent --show-error --max-time 30
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Log resultado
        if: always()
        run: echo "Ejecución completada ${{ job.status }}"